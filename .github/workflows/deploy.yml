name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master, 'claude/idle-clicker-game-qM4Av' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: idle_clicker_flutter

      - name: Build web release
        run: flutter build web --release --web-renderer html --base-href "/Briansidleclicker/"
        working-directory: idle_clicker_flutter

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: idle_clicker_flutter/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
